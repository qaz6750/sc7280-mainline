%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/siliconmitus,sm5714.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Silicon Mitus SM5714 multi-function device

maintainers:
  - XiaoYeZi <qaz6750@outlook.com>

description:
  The SM5714 combines a switching charger, fuel gauge and MUIC. The blocks
  use fixed secondary I2C addresses managed by the parent MFD driver.

properties:
  compatible:
    const: siliconmitus,sm5714

  reg:
    const: 0x49

  interrupts:
    maxItems: 1

  wakeup-source: true

  charger:
    type: object
    properties:
      compatible:
        const: siliconmitus,sm5714-charger

      monitored-battery:
        $ref: /schemas/types.yaml#/definitions/phandle
        description: Phandle to the battery characteristics node.

      usb-otg-vbus:
        $ref: /schemas/regulator/regulator.yaml#
        description: Regulator controlling the charger boost output on VBUS.

    required:
      - compatible

    additionalProperties: false

  fuel-gauge:
    type: object
    properties:
      compatible:
        const: siliconmitus,sm5714-fuel-gauge

      power-supplies:
        $ref: /schemas/types.yaml#/definitions/phandle-array
        items:
          maxItems: 1
        description: Phandle to the SM5714 charger power supply.

    required:
      - compatible

    additionalProperties: false

required:
  - compatible
  - reg
  - charger
  - fuel-gauge

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        pmic@49 {
            compatible = "siliconmitus,sm5714";
            reg = <0x49>;
            interrupt-parent = <&tlmm>;
            interrupts = <54 IRQ_TYPE_LEVEL_LOW>;
            wakeup-source;

            charger {
                compatible = "siliconmitus,sm5714-charger";

                usb_otg_vbus: usb-otg-vbus {
                    regulator-name = "sm5714-usb-otg-vbus";
                };
            };

            fuel-gauge {
                compatible = "siliconmitus,sm5714-fuel-gauge";
            };
        };
    };