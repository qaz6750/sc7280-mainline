%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/siliconmitus,sm5714-typec.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Silicon Mitus SM5714 USB Type-C Port Controller

maintainers:
  - XiaoYeZi <qaz6750@outlook.com>

description:
  The SM5714 contains a USB Type-C CC and Power Delivery controller. This
  binding describes its standalone I2C interface used for CC attachment,
  connector orientation and USB data-role detection.

properties:
  compatible:
    const: siliconmitus,sm5714-typec

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  wakeup-source: true

  vbus-supply:
    description: Regulator supplying VBUS while the port is acting as source.

  connector:
    $ref: /schemas/connector/usb-connector.yaml#
    unevaluatedProperties: false

required:
  - compatible
  - reg
  - interrupts
  - vbus-supply
  - connector

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    usb_otg_vbus: regulator-vbus {
        compatible = "regulator-fixed";
        regulator-name = "usb-otg-vbus";
    };

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        typec@33 {
            compatible = "siliconmitus,sm5714-typec";
            reg = <0x33>;
            interrupt-parent = <&gpio>;
            interrupts = <142 IRQ_TYPE_LEVEL_LOW>;
            vbus-supply = <&usb_otg_vbus>;

            connector {
                compatible = "usb-c-connector";
                power-role = "dual";
                data-role = "dual";
            };
        };
    };
...